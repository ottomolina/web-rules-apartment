<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guía del Huésped</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --accent: #0ea5e9;
            --whatsapp: #16a34a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #f8fafc;
                --muted: #94a3b8;
                --border: #334155;
                --whatsapp: #22c55e;
            }
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 1rem;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
        }

        .lang-btn {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.4rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .wifi-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: #ffffff;
            width: 100%;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-whatsapp svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: currentColor;
        }

        ul {
            padding-left: 1.2rem;
            margin: 0.5rem 0 0;
        }

        li {
            margin-bottom: 0.5rem;
        }

        details {
            border-top: 1px solid var(--border);
            padding: 0.75rem 0;
        }

        details:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        summary {
            font-weight: 600;
            cursor: pointer;
        }

        details p {
            margin: 0.5rem 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

                balconyRule3: "Clean with a damp mop only.",

                amenitiesTitle: "COMMON AREAS AND AMENITIES",
                amenitiesRule1: "Exclusive use for registered guests <strong>(no visitors)</strong>.",
                amenitiesRule2: "Do not walk through elevators or common areas shirtless, barefoot, or wet.",
                amenitiesRule3: "Respect capacity limits and hours for each amenity.",
                amenitiesRule4: "Leaving motorcycles in common areas is prohibited.",

                behaviorTitle: "BEHAVIOR",
                behaviorRule1: "Respect security, cleaning, and management staff.",
                behaviorRule2: "Any disrespect (verbal or physical) is a serious offense.",

                checkoutTitle: "IMPORTANT",
                checkout1: "All guests are subject to the <strong>VIDALTA Building Condominium and Administration Bylaws</strong> and these Short-Term Rental Rules. Management reserves the right of admission and may evict without prior notice for non-compliance. Fines from <strong>Q500.00</strong> up to <strong>Q2,500.00</strong> will be charged to the guest.",
                checkout2: "<strong>By booking and entering the apartment, you agree to these rules.</strong>",

        // 1. Detectar idioma guardado o del dispositivo
        const savedLang = localStorage.getItem("lang");
        const deviceLang = (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
        let currentLang = savedLang || deviceLang;

        const langToggle = document.getElementById("langToggle");
        const copyBtn = document.getElementById("copyBtn");
        const whatsappBtn = document.getElementById("whatsappBtn");

        function updateWhatsappLink(lang) {
            const encodedText = encodeURIComponent(translations[lang].whatsappMsg);
            whatsappBtn.href = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedText}`;
        }

        function applyLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            langToggle.textContent = lang === "es" ? "EN" : "ES";

            document.querySelectorAll("[data-i18n]").forEach((el) => {
                const key = el.getAttribute("data-i18n");
                if (translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });

            updateWhatsappLink(lang);
        }

        langToggle.addEventListener("click", () => {
            const nextLang = currentLang === "es" ? "en" : "es";
            localStorage.setItem("lang", nextLang);
            applyLanguage(nextLang);
        });

        copyBtn.addEventListener("click", async () => {
            const pass = document.getElementById("wifiPass").textContent;
            await navigator.clipboard.writeText(pass);
            copyBtn.textContent = translations[currentLang].copiedBtn;
            setTimeout(() => {
                copyBtn.textContent = translations[currentLang].copyBtn;
            }, 2000);
        });

        applyLanguage(currentLang);
    </script>

</html>
